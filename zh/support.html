  <main class="legal">
    <div class="wrap legal-wrap">
      <a class="back-link" href="./">← <span data-i18n="legal.back">返回首页</span></a>

      <div class="section-head support-wrap" style="text-align:left;margin:0 0 36px;">
        <span class="kicker" data-i18n="support.kicker">支持</span>
        <h1 style="font-size:clamp(1.9rem,4vw,2.6rem);margin:10px 0 12px;" data-i18n="support.title">我们随时为你提供帮助</h1>
        <p style="font-size:1.1rem;color:var(--ink-soft);margin:0;" data-i18n="support.subtitle">有 bug、想法，或者只是想问个问题？填写表单，我们会尽快回复你。</p>
      </div>

      <div class="support-wrap">
        <div class="support-card">

          <!-- ---- type tiles ---- -->
          <div>
            <p style="font-weight:700;font-size:.95rem;margin:0 0 12px;" data-i18n="support.form.type.label">请求类型</p>
            <div class="support-types" role="group">
              <input class="type-option" type="radio" name="type" id="t-bug" value="Bug report">
              <label for="t-bug" data-i18n="support.form.type.bug">🐛  错误报告</label>

              <input class="type-option" type="radio" name="type" id="t-feature" value="Feature request / Idea">
              <label for="t-feature" data-i18n="support.form.type.feature">💡  功能请求 / 想法</label>

              <input class="type-option" type="radio" name="type" id="t-question" value="Question">
              <label for="t-question" data-i18n="support.form.type.question">❓  问题</label>

              <input class="type-option" type="radio" name="type" id="t-other" value="Other">
              <label for="t-other" data-i18n="support.form.type.other">✉️  其他</label>
            </div>
          </div>

          <!-- ---- form ---- -->
          <form id="support-form" action="https://formsubmit.co/szaroczarnytrzmiel@gmail.com" method="POST" novalidate="">

            <!-- FormSubmit config -->
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_template" value="table">
            <input type="hidden" name="_subject" id="hidden-subject" value="Kostka Pixel — new support request">

            <!-- hidden: passes the selected type tile value -->
            <input type="hidden" name="request_type" id="hidden-type" value="">

            <div class="form-group">
              <label for="f-name">
                <span data-i18n="support.form.name.label">你的姓名</span>
                <span class="form-optional" data-i18n="support.form.name.placeholder">可选</span>
              </label>
              <input class="form-control" type="text" id="f-name" name="name" autocomplete="name" data-i18n-attr="placeholder:support.form.name.placeholder" placeholder="可选">
            </div>

            <div class="form-group">
              <label for="f-email">
                <span data-i18n="support.form.email.label">你的电子邮箱</span>
                <span style="color:#e85c50;margin-left:2px" aria-hidden="true">*</span>
              </label>
              <input class="form-control" type="email" id="f-email" name="email" required="" autocomplete="email" data-i18n-attr="placeholder:support.form.email.placeholder" placeholder="以便我们回复你">
            </div>

            <div class="form-group">
              <label for="f-message">
                <span data-i18n="support.form.message.label">留言</span>
                <span style="color:#e85c50;margin-left:2px" aria-hidden="true">*</span>
              </label>
              <textarea class="form-control" id="f-message" name="message" required="" rows="5" data-i18n-attr="placeholder:support.form.message.placeholder" placeholder="描述问题或分享你的想法……"></textarea>
            </div>

            <div class="form-submit">
              <button class="btn btn-primary" type="submit" id="submit-btn">
                <span id="submit-label" data-i18n="support.form.submit">发送留言</span>
              </button>
            </div>
          </form>

          <!-- result banner -->
          <div class="form-result" id="form-result" role="alert">
            <strong id="result-title"></strong>
            <span id="result-text"></span>
          </div>

        </div><!-- /.support-card -->

  <script>document.getElementById("year").textContent = new Date().getFullYear();</script>
  <script>
    (function () {
      const form      = document.getElementById("support-form");
      const submitBtn = document.getElementById("submit-btn");
      const submitLbl = document.getElementById("submit-label");
      const resultBox = document.getElementById("form-result");
      const resTitle  = document.getElementById("result-title");
      const resText   = document.getElementById("result-text");
      const hiddenType = document.getElementById("hidden-type");
      const hiddenSubject = document.getElementById("hidden-subject");

      document.querySelectorAll(".type-option").forEach(function (radio) {
        radio.addEventListener("change", function () {
          hiddenType.value = radio.value;
          hiddenSubject.value = "Kostka Pixel support: " + radio.value;
        });
      });

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        const email = form.querySelector("#f-email").value.trim();
        const msg   = form.querySelector("#f-message").value.trim();
        if (!email || !msg) return;

        const lang = document.documentElement.lang || "en";
        const dict = (typeof I18N !== "undefined" && I18N[lang]) ? I18N[lang] : {};

        submitLbl.textContent = dict["support.form.sending"] || "Sending…";
        submitBtn.disabled = true;
        resultBox.className = "form-result";

        const data = new FormData(form);

        try {
          const res = await fetch(form.action, {
            method: "POST",
            body: data,
            headers: { Accept: "application/json" }
          });

          if (res.ok) {
            resultBox.className = "form-result success";
            resTitle.textContent = dict["support.form.success.title"] || "Message sent!";
            resText.textContent  = dict["support.form.success.text"]  || "Thank you — we'll get back to you as soon as possible.";
            form.reset();
            hiddenType.value = "";
          } else {
            throw new Error("non-ok");
          }
        } catch (_) {
          resultBox.className = "form-result error";
          resTitle.textContent = "";
          resText.textContent  = dict["support.form.error"] || "Something went wrong. Please try again or e-mail us directly at szaroczarnytrzmiel@gmail.com";
        } finally {
          submitLbl.textContent = dict["support.form.submit"] || "Send message";
          submitBtn.disabled = false;
          resultBox.scrollIntoView({ behavior: "smooth", block: "nearest" });
        }
      });
    })();
  </script>
